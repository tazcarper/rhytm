# Save this file in the repo as .github/workflows/claude-build.yml
#
# When the admin presses "Build it" on a feature request, the app opens a
# GitHub issue with the "claude-build" label. This workflow hands that issue
# to Claude, which builds the feature on a branch. A pull request is then
# opened from that branch, so Vercel makes a preview. Merging stays manual.

name: Claude builds a feature request

on:
  issues:
    types: [labeled]
  # "Something's not right" on the admin card posts an @claude comment on
  # the build's pull request; Claude then fixes the same branch.
  issue_comment:
    types: [created]

concurrency:
  group: claude-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude-build') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Claude builds it
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Uses the Claude Pro plan (token from `claude setup-token`), not the API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-build
          claude_args: >-
            --max-turns 250
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run typecheck),Bash(npm run lint),Bash(npx tsc:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(npx supabase migration new:*)"

      - name: Refresh the test steps on the pull request
        # After fixing staff feedback, swap in Claude's new "How to test"
        # steps (the admin card reads them from the PR body).
        if: ${{ !cancelled() && github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          SUMMARY=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | last | .body // ""')
          TESTING=$(printf '%s\n' "$SUMMARY" | awk 'tolower($0) ~ /^#+ *how to test/ {on=1; print; next} on && /^#+ / {exit} on')
          if [ -z "$TESTING" ]; then exit 0; fi
          OLD=$(gh pr view "$PR" --json body -q .body)
          KEPT=$(printf '%s\n' "$OLD" | awk 'tolower($0) ~ /^#+ *how to test/ {exit} {print}')
          gh pr edit "$PR" --body "${KEPT}"$'\n'"${TESTING}"

      - name: Open the pull request
        # Not when the run was cancelled. If Claude stopped early (an error
        # or a usage limit), the PR opens as a draft marked incomplete.
        if: ${{ !cancelled() && github.event_name == 'issues' && steps.claude.outputs.branch_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$(git ls-remote --heads origin "$BRANCH")" ]; then
            echo "Claude didn't push a branch, so there's nothing to open."
            exit 0
          fi
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "A pull request is already open for $BRANCH."
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          if npm run typecheck > typecheck.log 2>&1; then
            CHECK="Typecheck passed."
          else
            CHECK="**Typecheck failed.** Last lines:"$'\n\n```\n'"$(tail -n 30 typecheck.log)"$'\n```'
          fi
          # Claude's "## How to test" steps from its summary on the issue, so
          # the admin page can show them (the webhook reads them from here).
          SUMMARY=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | last | .body // ""')
          TESTING=$(printf '%s\n' "$SUMMARY" | awk 'tolower($0) ~ /^#+ *how to test/ {on=1; print; next} on && /^#+ / {exit} on')
          BODY="Closes #${ISSUE}"$'\n\n'"Built by Claude from a feature request. Test it on the Vercel preview below, then merge when it's good. Merging marks the request Built and unlocks the drafts waiting on it."$'\n\n'"Any new file under supabase/migrations is applied to the preview database now, and to production when this merges."$'\n\n'"${CHECK}"$'\n\n'"${TESTING}"
          if [ "$CLAUDE_OUTCOME" = "success" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            BODY="**Claude stopped before finishing, so this is incomplete.** Press Build it again on the request, or close this."$'\n\n'"$BODY"
            gh pr create --draft --base main --head "$BRANCH" --title "[Incomplete] $TITLE" --body "$BODY"
          fi

      - name: Apply its migrations to the preview database
        # PRs opened by this workflow don't start other workflows on their
        # own, so start supabase-migrations.yml for the new branch.
        if: ${{ !cancelled() && steps.claude.outputs.branch_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          if [ -z "$(git ls-remote --heads origin "$BRANCH")" ]; then exit 0; fi
          git fetch -q origin "$BRANCH" main
          if git diff --quiet origin/main...origin/"$BRANCH" -- supabase/migrations; then
            echo "No new migrations."
            exit 0
          fi
          gh workflow run supabase-migrations.yml --ref "$BRANCH" -f target=preview
